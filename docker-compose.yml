services:
  backend:
    image: ghcr.io/capstone2026-e04/subur-in-backend:latest
    env_file: ./backend/.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/capstone2026-e04/subur-in-frontend:latest
    env_file: ./frontend/.env.local
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_metrics_password.txt:/etc/prometheus/metrics_password.txt:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  prometheus_data:
