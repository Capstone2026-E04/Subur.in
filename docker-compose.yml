services:
  backend:
    image: ghcr.io/capstone2026-e04/subur-in-backend:latest
    env_file: ./backend/.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/capstone2026-e04/subur-in-frontend:latest
    env_file: ./frontend/.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
