<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="640" fill="#fff"/>
  <style>
    .ax { stroke: #444; stroke-width: 1.5; fill: none }
    .gr { stroke: #ccc; stroke-dasharray: 4 4 }
    .f  { stroke-width: 3; fill-opacity: .12 }
    .t  { fill: #333 }
    .s  { fill: #666; font-size: 12px }
  </style>

  <!-- Panel 1: pH -->
  <g transform="translate(0,0)">
    <text x="60" y="24" font-size="16" font-weight="600" class="t">Fungsi keanggotaan pH (PH_MARGIN = 0,5)</text>
    <line class="gr" x1="60" y1="40" x2="840" y2="40"/>
    <line class="gr" x1="230" y1="40" x2="230" y2="190"/>
    <line class="gr" x1="380" y1="40" x2="380" y2="190"/>
    <line class="gr" x1="520" y1="40" x2="520" y2="190"/>
    <line class="gr" x1="670" y1="40" x2="670" y2="190"/>
    <polyline class="f" stroke="#d9534f" fill="#d9534f" points="60,190 60,40 230,40 380,190"/>
    <polyline class="f" stroke="#2e9e5b" fill="#2e9e5b" points="230,190 380,40 520,40 670,190"/>
    <polyline class="f" stroke="#2f7fd1" fill="#2f7fd1" points="520,190 670,40 840,40 840,190"/>
    <path class="ax" d="M60 40V190H840"/>
    <text x="48" y="44" text-anchor="end" class="s">1</text>
    <text x="48" y="194" text-anchor="end" class="s">0</text>
    <text x="230" y="210" text-anchor="middle" class="s">min − 0,5</text>
    <text x="380" y="210" text-anchor="middle" class="s">min</text>
    <text x="520" y="210" text-anchor="middle" class="s">max</text>
    <text x="670" y="210" text-anchor="middle" class="s">max + 0,5</text>
    <text x="140" y="32" text-anchor="middle" fill="#d9534f" font-weight="600">asam</text>
    <text x="450" y="32" text-anchor="middle" fill="#2e9e5b" font-weight="600">optimal</text>
    <text x="760" y="32" text-anchor="middle" fill="#2f7fd1" font-weight="600">basa</text>
    <text x="450" y="232" text-anchor="middle" class="s">pH tanah (min/max per tanaman, mis. dari data tanaman)</text>
  </g>

  <!-- Panel 2: kelembapan -->
  <g transform="translate(0,300)">
    <text x="60" y="24" font-size="16" font-weight="600" class="t">Fungsi keanggotaan kelembapan (θ, VWC; θ_CC = 0,3298)</text>
    <line class="gr" x1="60" y1="40" x2="840" y2="40"/>
    <line class="gr" x1="186.6" y1="40" x2="186.6" y2="190"/>
    <line class="gr" x1="400.9" y1="40" x2="400.9" y2="190"/>
    <line class="gr" x1="615.3" y1="40" x2="615.3" y2="190"/>
    <line class="gr" x1="722.5" y1="40" x2="722.5" y2="190"/>
    <polyline class="f" stroke="#d9534f" fill="#d9534f" points="60,190 60,40 186.6,40 400.9,190"/>
    <polyline class="f" stroke="#2e9e5b" fill="#2e9e5b" points="186.6,190 400.9,40 615.3,40 722.5,190"/>
    <polyline class="f" stroke="#2f7fd1" fill="#2f7fd1" points="615.3,190 722.5,40 840,40 840,190"/>
    <path class="ax" d="M60 40V190H840"/>
    <text x="48" y="44" text-anchor="end" class="s">1</text>
    <text x="48" y="194" text-anchor="end" class="s">0</text>
    <text x="186.6" y="210" text-anchor="middle" class="s">A = 0,165</text>
    <text x="186.6" y="224" text-anchor="middle" class="s">(0,50 CC)</text>
    <text x="400.9" y="210" text-anchor="middle" class="s">B = 0,275</text>
    <text x="400.9" y="224" text-anchor="middle" class="s">(0,83 CC)</text>
    <text x="615.3" y="210" text-anchor="middle" class="s">D = 0,385</text>
    <text x="615.3" y="224" text-anchor="middle" class="s">(1,17 CC)</text>
    <text x="722.5" y="210" text-anchor="middle" class="s">E = 0,440</text>
    <text x="722.5" y="224" text-anchor="middle" class="s">(1,33 CC)</text>
    <text x="120" y="32" text-anchor="middle" fill="#d9534f" font-weight="600">kering</text>
    <text x="508" y="32" text-anchor="middle" fill="#2e9e5b" font-weight="600">lembap</text>
    <text x="790" y="32" text-anchor="middle" fill="#2f7fd1" font-weight="600">jenuh</text>
  </g>

  <text x="60" y="600" class="s">Output: 9 aturan (R1–R9) → kategori C1–C9; defuzzifikasi centroid dengan pusat air {STOP −1, NONE 0, IRRIGATE 1} dan pH {SULFUR −1, NONE 0, LIME 1}.</text>
  <text x="60" y="618" class="s">Sumber: backend/src/ai/core/membership.js, rules.js, config/treatment_constants.js</text>
</svg>
